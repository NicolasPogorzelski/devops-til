name: Commit messages

# The half that does not live on one workstation.
#
# scripts/commit-msg-lint.sh runs as a git hook, and a git hook is per-machine
# state no commit can guarantee. Measured on 2026-09-12, no machine had it
# installed, so the script had never run and an attribution trailer reached the
# published history of this repository.
#
# Note what this workflow can and cannot do here. These notes are published by
# pushing to main, not through pull requests, so on a push this runs *after* the
# commit is already public: it reports, it does not prevent. The tracked hook in
# scripts/hooks/ is the preventive half. Both are kept, because a preventive gate
# that somebody forgets to install needs something behind it that notices.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Pinned to a commit SHA: a major-version tag is a moving reference the
        # upstream owner can repoint at any commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default shallow clone cannot walk a commit range.
          fetch-depth: 0

      - name: Lint every message in this push or pull request
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          chmod +x scripts/commit-msg-lint.sh

          if [ -n "${PR_HEAD_SHA}" ]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            range="${BEFORE_SHA}..${AFTER_SHA}"
          else
            # A new branch has no "before". Reading its whole history would
            # re-judge commits that are already published and cannot be changed,
            # so only the tip is examined.
            range="${AFTER_SHA}~1..${AFTER_SHA}"
          fi

          failed=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            git log -1 --format=%B "$sha" > "${RUNNER_TEMP}/msg.txt"
            printf '%s %s\n' "${sha:0:9}" "$(git log -1 --format=%s "$sha")"
            ./scripts/commit-msg-lint.sh "${RUNNER_TEMP}/msg.txt" || failed=1
          done < <(git rev-list --no-merges "$range" 2>/dev/null || true)
          exit "$failed"

      # Title and body arrive through the environment rather than through `${{ }}`
      # inside the script body. Interpolating them directly would splice text an
      # author controls into the shell this job runs.
      - name: Lint the pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          { printf '%s\n\n' "$PR_TITLE"; printf '%s\n' "$PR_BODY"; } > "${RUNNER_TEMP}/pr.txt"
          ./scripts/commit-msg-lint.sh --attribution-only "${RUNNER_TEMP}/pr.txt"
